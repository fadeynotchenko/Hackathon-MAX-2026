# DATA-API 1.0 — сценарий обязательных HTTP-проверок сервиса подготовки документов:
# реквизиты своей организации и клиента → счёт из шаблона → заполнение позиций →
# сборка DOCX → чтение из истории; cleanup удаляет всё, что сценарий создал.
#
# Секретов здесь нет: токен роли user передаётся отдельным каналом. Его выпускает
# оператор на срок проверки (внутри контейнера api):
#   python -m core.scripts.issue_reviewer_token --days 14
#
# Тела запросов совпадают с test-data.json (генерируется из core.usecases.documents.demo).
# Сценарий целиком прогоняется против приложения тестом core/tests/api/test_data_api.py,
# пути и методы сверены с contracts/openapi.json (генерируется из кода).

schemaVersion: "1.0"

solution:
  name: "Документы для бизнеса в MAX"
  teamId: "409"

api:
  baseUrl: "https://project-documents-max.ru"
  openapi: "./contracts/openapi.json"
  defaultHeaders:
    Accept: "application/json"

checks:
  - id: "health"
    name: "Сервис отвечает"
    description: "Проверка БД, Redis и фонового потребителя событий"
    method: "GET"
    path: "/api/v1/health"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields:
        - "status"
        - "checks"
      bodySchema:
        type: "object"
        required: ["status", "checks"]
        properties:
          status:
            const: "ok"
    timeoutMs: 5000
    repeatable: true

  - id: "invoice-template"
    name: "Шаблон счёта доступен"
    description: "Библиотека шаблонов отдаёт стандартный счёт с описанием полей"
    method: "GET"
    path: "/api/v1/templates"
    role: "user"
    request:
      query:
        slug: "invoice"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: "array"
    timeoutMs: 5000
    repeatable: true
    extract:
      templateId: "$[0].id"

  - id: "create-organization"
    name: "Реквизиты своей организации сохраняются"
    description: "ИНН, ОГРН, КПП, БИК и расчётный счёт проверяются контрольными суммами"
    method: "POST"
    path: "/api/v1/organizations"
    role: "user"
    request:
      headers:
        Content-Type: "application/json"
      body:
        name: "ООО «Ромашка»"
        values:
          inn: "7728417603"
          kpp: "772801001"
          ogrn: "1177746012344"
          address: "117312, г. Москва, ул. Вавилова, д. 19, офис 5"
          director: "Иванов Иван Иванович"
          bank: "ПАО Сбербанк"
          bic: "044525225"
          account: "40702810538000123456"
          corr_account: "30101810400000000225"
          phone: "+79001234567"
          email: "info@romashka.example"
    expected:
      statusCodes: [201]
      contentType: "application/json"
      requiredFields:
        - "id"
        - "name"
        - "inn"
        - "values"
    timeoutMs: 5000
    repeatable: false
    extract:
      organizationId: "$.id"

  - id: "create-counterparty"
    name: "Карточка клиента сохраняется"
    description: "Реквизиты клиента проходят те же проверки, что и свои"
    method: "POST"
    path: "/api/v1/counterparties"
    role: "user"
    request:
      headers:
        Content-Type: "application/json"
      body:
        name: "ООО «Альфа»"
        values:
          inn: "5003102144"
          kpp: "500301001"
          ogrn: "1195010012340"
          address: "142700, Московская обл., г. Видное, ул. Школьная, д. 1"
          director: "Петров Пётр Петрович"
          bank: "АО «ТБанк»"
          bic: "044525974"
          account: "40702810610000654321"
          corr_account: "30101810145250000974"
          phone: "+79007654321"
          email: "office@alfa.example"
    expected:
      statusCodes: [201]
      contentType: "application/json"
      requiredFields:
        - "id"
        - "name"
        - "inn"
    timeoutMs: 5000
    repeatable: false
    extract:
      counterpartyId: "$.id"

  - id: "create-document"
    name: "Счёт создаётся из шаблона"
    description: "Реквизиты продавца и покупателя подставляются из карточек сами"
    method: "POST"
    path: "/api/v1/documents"
    role: "user"
    dependsOn:
      - "invoice-template"
      - "create-organization"
      - "create-counterparty"
    request:
      headers:
        Content-Type: "application/json"
      body:
        template_id: "${templateId}"
        organization_id: "${organizationId}"
        counterparty_id: "${counterpartyId}"
        title: "Счёт для технической проверки"
    expected:
      statusCodes: [201]
      contentType: "application/json"
      requiredFields:
        - "id"
        - "status"
        - "values"
        - "missing"
        - "preview"
    timeoutMs: 5000
    repeatable: false
    extract:
      documentId: "$.id"

  - id: "fill-document"
    name: "Номер, дата и позиции счёта заполняются"
    description: "Итог и сумма прописью считаются из позиций, документ становится готовым"
    method: "PATCH"
    path: "/api/v1/documents/{document_id}/fields"
    role: "user"
    dependsOn:
      - "create-document"
    request:
      path:
        document_id: "${documentId}"
      headers:
        Content-Type: "application/json"
      body:
        values:
          number:
            value: "1"
          date:
            value: "24.09.2026"
          items:
            value: '[{"name": "Подготовка пакета документов", "quantity": "1", "unit": "усл.", "price": "100000"}, {"name": "Консультация юриста", "quantity": "2", "unit": "ч", "price": "10000"}]'
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields:
        - "ready"
        - "errors"
        - "missing"
        - "preview"
      bodySchema:
        type: "object"
        required: ["ready", "errors"]
        properties:
          ready:
            const: true
          errors:
            const: []
    timeoutMs: 5000
    repeatable: true

  - id: "render-document"
    name: "Файл счёта собирается"
    description: "Готовый документ превращается в DOCX по бланку"
    method: "POST"
    path: "/api/v1/documents/{document_id}/render"
    role: "user"
    dependsOn:
      - "fill-document"
    request:
      path:
        document_id: "${documentId}"
      headers:
        Content-Type: "application/json"
      body:
        format: "docx"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields:
        - "format"
        - "filename"
        - "size"
        - "stale"
      bodySchema:
        type: "object"
        properties:
          format:
            const: "docx"
          stale:
            const: false
    timeoutMs: 15000
    repeatable: true

  - id: "read-document"
    name: "Документ читается из истории"
    method: "GET"
    path: "/api/v1/documents/{document_id}"
    role: "user"
    dependsOn:
      - "render-document"
    request:
      path:
        document_id: "${documentId}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields:
        - "id"
        - "title"
        - "status"
        - "ready"
      bodySchema:
        type: "object"
        properties:
          ready:
            const: true
    timeoutMs: 5000
    repeatable: true

cleanup:
  - id: "delete-document"
    method: "DELETE"
    path: "/api/v1/documents/{document_id}"
    role: "user"
    request:
      path:
        document_id: "${documentId}"
    expected:
      statusCodes: [200, 404]
    timeoutMs: 5000

  - id: "delete-counterparty"
    method: "DELETE"
    path: "/api/v1/counterparties/{counterparty_id}"
    role: "user"
    request:
      path:
        counterparty_id: "${counterpartyId}"
    expected:
      statusCodes: [200, 404]
    timeoutMs: 5000

  - id: "delete-organization"
    method: "DELETE"
    path: "/api/v1/organizations/{organization_id}"
    role: "user"
    request:
      path:
        organization_id: "${organizationId}"
    expected:
      statusCodes: [200, 404]
    timeoutMs: 5000
