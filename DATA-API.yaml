# DATA-API 1.0: обязательные HTTP-проверки сервиса подготовки документов.
#
# Сценарий идёт по основному пути пользователя: реквизиты своей организации и
# клиента, счёт из шаблона, позиции, сборка DOCX, отправка в чат MAX, путь
# документа, акт по счёту. Отдельные проверки показывают отказы: запрос без
# токена, реквизит с неверной контрольной суммой, чужой или несуществующий id.
# Cleanup удаляет всё, что сценарий создал, поэтому его можно гонять повторно.
#
# Секретов в файле нет. Токен роли user выпускает оператор на срок проверки
# (внутри контейнера api) и передаёт отдельным каналом:
#   python -m core.scripts.issue_reviewer_token --days 365
#
# Тела запросов совпадают с test-data.json (генерируется из core.usecases.documents.demo).
# Весь сценарий прогоняется против приложения тестом core/tests/api/test_data_api.py,
# пути и методы сверены с contracts/openapi.json (генерируется из кода).

schemaVersion: "1.0"

solution:
  name: "Документы для бизнеса в MAX"
  teamId: "409"

api:
  baseUrl: "https://project-documents-max.ru"
  openapi: "./contracts/openapi.json"
  defaultHeaders:
    Accept: "application/json"

checks:
  - id: "health"
    name: "Сервис отвечает"
    description: "Состояние БД, Redis и фонового потребителя событий бота"
    method: "GET"
    path: "/api/v1/health"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields:
        - "status"
        - "checks"
      bodySchema:
        type: "object"
        required: ["status", "checks"]
        properties:
          status:
            const: "ok"
          checks:
            type: "object"
            required: ["database", "redis"]
    timeoutMs: 5000
    repeatable: true

  - id: "auth-required"
    name: "Без токена данные пользователя закрыты"
    description: "Запрос без заголовка авторизации получает 401 в едином формате ошибки с машинным кодом"
    method: "GET"
    path: "/api/v1/documents"
    role: "public"
    expected:
      statusCodes: [401]
      contentType: "application/json"
      requiredFields:
        - "detail"
        - "code"
        - "request_id"
      bodySchema:
        type: "object"
        properties:
          code:
            const: "auth.missing_token"
    timeoutMs: 5000
    repeatable: true

  - id: "profile"
    name: "Профиль текущего пользователя"
    description: "Токен проверяющего принимается, учётка отдельная и без прав администратора"
    method: "GET"
    path: "/api/v1/me"
    role: "user"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields:
        - "id"
        - "max_user_id"
        - "display_name"
        - "is_admin"
      bodySchema:
        type: "object"
        properties:
          is_admin:
            const: false
    timeoutMs: 5000
    repeatable: true

  - id: "invoice-template"
    name: "Шаблон счёта доступен"
    description: "Библиотека шаблонов отдаёт стандартный счёт с описанием полей"
    method: "GET"
    path: "/api/v1/templates"
    role: "user"
    request:
      query:
        slug: "invoice"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: "array"
    timeoutMs: 5000
    repeatable: true
    extract:
      templateId: "$[0].id"

  - id: "invalid-requisites"
    name: "Реквизит с неверной контрольной суммой отклоняется"
    description: "ИНН с неверным контрольным разрядом: 422 с текстом для человека, организация не сохраняется"
    method: "POST"
    path: "/api/v1/organizations"
    role: "user"
    request:
      headers:
        Content-Type: "application/json"
      body:
        name: "ООО «Ромашка»"
        values:
          inn: "7728417604"
    expected:
      statusCodes: [422]
      contentType: "application/json"
      requiredFields:
        - "detail"
        - "code"
      bodySchema:
        type: "object"
        properties:
          code:
            const: "organization.invalid"
    timeoutMs: 5000
    repeatable: true

  - id: "create-organization"
    name: "Реквизиты своей организации сохраняются"
    description: "ИНН, ОГРН, КПП, БИК и расчётный счёт проверяются контрольными суммами"
    method: "POST"
    path: "/api/v1/organizations"
    role: "user"
    request:
      headers:
        Content-Type: "application/json"
      body:
        name: "ООО «Ромашка»"
        values:
          inn: "7728417603"
          kpp: "772801001"
          ogrn: "1177746012344"
          address: "117312, г. Москва, ул. Вавилова, д. 19, офис 5"
          director: "Иванов Иван Иванович"
          bank: "ПАО Сбербанк"
          bic: "044525225"
          account: "40702810538000123456"
          corr_account: "30101810400000000225"
          phone: "+79001234567"
          email: "info@romashka.example"
    expected:
      statusCodes: [201]
      contentType: "application/json"
      requiredFields:
        - "id"
        - "name"
        - "inn"
        - "values"
    timeoutMs: 5000
    repeatable: false
    extract:
      organizationId: "$.id"

  - id: "create-counterparty"
    name: "Карточка клиента сохраняется"
    description: "Реквизиты клиента проходят те же проверки, что и свои"
    method: "POST"
    path: "/api/v1/counterparties"
    role: "user"
    request:
      headers:
        Content-Type: "application/json"
      body:
        name: "ООО «Альфа»"
        values:
          inn: "5003102144"
          kpp: "500301001"
          ogrn: "1195010012340"
          address: "142700, Московская обл., г. Видное, ул. Школьная, д. 1"
          director: "Петров Пётр Петрович"
          bank: "АО «ТБанк»"
          bic: "044525974"
          account: "40702810610000654321"
          corr_account: "30101810145250000974"
          phone: "+79007654321"
          email: "office@alfa.example"
    expected:
      statusCodes: [201]
      contentType: "application/json"
      requiredFields:
        - "id"
        - "name"
        - "inn"
    timeoutMs: 5000
    repeatable: false
    extract:
      counterpartyId: "$.id"

  - id: "create-document"
    name: "Счёт создаётся из шаблона"
    description: "Реквизиты продавца и покупателя подставляются из карточек сами"
    method: "POST"
    path: "/api/v1/documents"
    role: "user"
    dependsOn:
      - "invoice-template"
      - "create-organization"
      - "create-counterparty"
    request:
      headers:
        Content-Type: "application/json"
      body:
        template_id: "${templateId}"
        organization_id: "${organizationId}"
        counterparty_id: "${counterpartyId}"
        title: "Счёт для технической проверки"
    expected:
      statusCodes: [201]
      contentType: "application/json"
      requiredFields:
        - "id"
        - "status"
        - "values"
        - "missing"
        - "preview"
    timeoutMs: 5000
    repeatable: false
    extract:
      documentId: "$.id"

  - id: "fill-document"
    name: "Номер, дата и позиции счёта заполняются"
    description: "Итог и сумма прописью считаются из позиций, документ становится готовым"
    method: "PATCH"
    path: "/api/v1/documents/{document_id}/fields"
    role: "user"
    dependsOn:
      - "create-document"
    request:
      path:
        document_id: "${documentId}"
      headers:
        Content-Type: "application/json"
      body:
        values:
          number:
            value: "1"
          date:
            value: "24.09.2026"
          items:
            value: '[{"name": "Подготовка пакета документов", "quantity": "1", "unit": "усл.", "price": "100000"}, {"name": "Консультация юриста", "quantity": "2", "unit": "ч", "price": "10000"}]'
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields:
        - "ready"
        - "errors"
        - "missing"
        - "preview"
      bodySchema:
        type: "object"
        required: ["ready", "errors"]
        properties:
          ready:
            const: true
          errors:
            const: []
    timeoutMs: 5000
    repeatable: true

  - id: "render-document"
    name: "Файл счёта собирается"
    description: "Готовый документ превращается в DOCX по бланку"
    method: "POST"
    path: "/api/v1/documents/{document_id}/render"
    role: "user"
    dependsOn:
      - "fill-document"
    request:
      path:
        document_id: "${documentId}"
      headers:
        Content-Type: "application/json"
      body:
        format: "docx"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields:
        - "format"
        - "filename"
        - "size"
        - "stale"
      bodySchema:
        type: "object"
        properties:
          format:
            const: "docx"
          stale:
            const: false
    timeoutMs: 15000
    repeatable: true

  - id: "send-document"
    name: "Файл уходит в чат MAX"
    description: "Ядро ставит событие document.ready в очередь бота и отвечает 202 с его UUID; у учётки проверяющих выдуманный MAX-id, поэтому бот отметит недоставку, а не пришлёт файл"
    method: "POST"
    path: "/api/v1/documents/{document_id}/send"
    role: "user"
    dependsOn:
      - "render-document"
    request:
      path:
        document_id: "${documentId}"
      headers:
        Content-Type: "application/json"
      body:
        format: "docx"
    expected:
      statusCodes: [202]
      contentType: "application/json"
      requiredFields:
        - "event_id"
        - "format"
        - "filename"
      bodySchema:
        type: "object"
        properties:
          format:
            const: "docx"
    timeoutMs: 15000
    repeatable: false

  - id: "document-history"
    name: "Путь документа виден по шагам"
    description: "Журнал фактов: создан, готов, собран, отправлен (и доставлен, когда бот ответит)"
    method: "GET"
    path: "/api/v1/documents/{document_id}/history"
    role: "user"
    dependsOn:
      - "send-document"
    request:
      path:
        document_id: "${documentId}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: "array"
    timeoutMs: 5000
    repeatable: true

  - id: "create-act"
    name: "Акт по счёту создаётся в один клик"
    description: "Стороны, позиции и сумма переходят из счёта, номер и дата новые"
    method: "POST"
    path: "/api/v1/documents/{document_id}/act"
    role: "user"
    dependsOn:
      - "fill-document"
    request:
      path:
        document_id: "${documentId}"
    expected:
      statusCodes: [201]
      contentType: "application/json"
      requiredFields:
        - "id"
        - "status"
        - "template"
        - "values"
        - "preview"
      bodySchema:
        type: "object"
        properties:
          template:
            type: "object"
            properties:
              slug:
                const: "act"
    timeoutMs: 5000
    repeatable: false
    extract:
      actId: "$.id"

  - id: "read-document"
    name: "Документ читается с предпросмотром"
    method: "GET"
    path: "/api/v1/documents/{document_id}"
    role: "user"
    dependsOn:
      - "render-document"
    request:
      path:
        document_id: "${documentId}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields:
        - "id"
        - "title"
        - "status"
        - "ready"
        - "preview"
      bodySchema:
        type: "object"
        properties:
          ready:
            const: true
    timeoutMs: 5000
    repeatable: true

  - id: "list-documents"
    name: "История документов"
    description: "Список документов пользователя: счёт и акт из этого сценария"
    method: "GET"
    path: "/api/v1/documents"
    role: "user"
    dependsOn:
      - "create-act"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: "array"
    timeoutMs: 5000
    repeatable: true

  - id: "document-not-found"
    name: "Несуществующий документ отвечает 404"
    description: "Чужие и удалённые документы не видны: тот же 404 с машинным кодом"
    method: "GET"
    path: "/api/v1/documents/{document_id}"
    role: "user"
    request:
      path:
        document_id: 999999999
    expected:
      statusCodes: [404]
      contentType: "application/json"
      requiredFields:
        - "detail"
        - "code"
    timeoutMs: 5000
    repeatable: true

cleanup:
  - id: "delete-act"
    method: "DELETE"
    path: "/api/v1/documents/{document_id}"
    role: "user"
    request:
      path:
        document_id: "${actId}"
    expected:
      statusCodes: [200, 404]
    timeoutMs: 5000

  - id: "delete-document"
    method: "DELETE"
    path: "/api/v1/documents/{document_id}"
    role: "user"
    request:
      path:
        document_id: "${documentId}"
    expected:
      statusCodes: [200, 404]
    timeoutMs: 5000

  - id: "delete-counterparty"
    method: "DELETE"
    path: "/api/v1/counterparties/{counterparty_id}"
    role: "user"
    request:
      path:
        counterparty_id: "${counterpartyId}"
    expected:
      statusCodes: [200, 404]
    timeoutMs: 5000

  - id: "delete-organization"
    method: "DELETE"
    path: "/api/v1/organizations/{organization_id}"
    role: "user"
    request:
      path:
        organization_id: "${organizationId}"
    expected:
      statusCodes: [200, 404]
    timeoutMs: 5000
