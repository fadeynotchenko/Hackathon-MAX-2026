# Alembic: миграции схемы PostgreSQL. DSN берётся из окружения в
# src/core/db/migrations/env.py (DatabaseConfig), здесь его нет намеренно.
#
#   uv run alembic upgrade head                     # применить вручную (api делает это при старте)
#   uv run alembic revision --autogenerate -m "..."  # новая миграция после правки db/models.py
#   uv run alembic downgrade -1                      # откат на шаг
[alembic]
script_location = src/core/db/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = src
timezone = UTC
truncate_slug_length = 40

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root

[handlers]
keys =

[formatters]
keys =

[logger_root]
level = WARNING
handlers =
