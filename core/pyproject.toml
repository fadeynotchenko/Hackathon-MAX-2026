# Python-сервис core: API мини-аппа, фоновые воркеры, владелец PostgreSQL.
# Менеджер зависимостей — uv (uv.lock закоммичен; в Docker — `uv sync --frozen`).
#
#   uv sync                      # .venv + editable-установка пакета core
#   uv run pytest -q             # тесты
#   uv run ruff check . && uv run lint-imports

[project]
name = "core"
version = "0.1.0"
description = "MAX mini app core service: API, events worker, database owner"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.35",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "PyJWT>=2.10",
    "python-dotenv>=1.0",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "aiosqlite>=0.20",
    "fakeredis>=2.26",
    "ruff>=0.9",
    "import-linter>=2.1",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

# ---------------------------------------------------------------------------
# import-linter — контракты между слоями сервиса. Верхний слой может
# импортировать любой нижний; слои через `|` независимы друг от друга.
#   api  →  usecases  →  events | db  →  logs  →  config | domain
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "core"

[[tool.importlinter.contracts]]
name = "layers: api -> usecases -> events/db/files -> logs -> config/domain"
type = "layers"
layers = [
    "core.api",
    "core.usecases",
    "core.events | core.db | core.files",
    "core.logs",
    "core.config | core.domain",
]

# ---------------------------------------------------------------------------
# ruff — линтер и форматтер. Правила, которые ловят баги или безопасно
# автофиксятся; стиль — работа форматтера.
# ---------------------------------------------------------------------------
[tool.ruff]
cache-dir = ".cache/ruff"
target-version = "py313"
line-length = 100
extend-exclude = [".venv", "src/core/db/migrations/versions"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "ASYNC", "C4", "PIE", "LOG", "S", "RUF", "UP", "SIM"]
ignore = [
    "E501",                       # длина строк — форматтер
    "RUF001", "RUF002", "RUF003", # кириллица в строках и комментариях
    "S101",                       # assert разрешён (тесты и инварианты)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI DI вызывается в дефолтах аргументов by design.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header",
    "fastapi.Body", "fastapi.Cookie", "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC", "B017"]
"src/core/scripts/**" = ["S603", "S607"]  # subprocess с константными аргументами
"**/__init__.py" = ["F401"]               # re-export — публичный API пакета

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: тесты на настоящем PostgreSQL/Redis (пропускаются без TEST_DATABASE_URL)",
]
filterwarnings = ["error::RuntimeWarning:asyncio"]

[tool.pyright]
pythonVersion = "3.13"
exclude = [".venv", ".cache"]
