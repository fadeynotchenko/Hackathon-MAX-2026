# Прод-стенд. Запуск через ./deploy.sh (тесты в образе → снимок БД → up --build).
#
# Сервисы: db, redis, api, bot, gateway, db_backup. Каждая папка репозитория — своя
# деплой-единица (core, bot, gateway+web); вынос на отдельный хост сводится к
# переносу блока в другой compose. Миграции и потребитель событий бота — внутри api.
#
# Логи: stdout контейнеров с ротацией по объёму (живой хвост для `docker compose
# logs`) плюс файлы в ./app_logs (JSON, посуточно, бессрочно; см. docs/LOGGING.md).
# Hardening: read-only FS, tmpfs для /tmp, cap_drop ALL, no-new-privileges,
# лимиты памяти и pids — у всех, кроме db (ему нужны свои capabilities).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "10"
    compress: "true"

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

x-core: &core-service
  build:
    context: ./core
    target: runtime
  image: maxapp-core:latest
  env_file: .env
  environment: &python-env
    ENV: production
    DB_HOST: db
    REDIS_HOST: redis
    LOG_FORMAT: json
    LOG_DIR: /app/app_logs
  volumes:
    # Свой подкаталог под uid контейнера (deploy.sh выставляет владельцев).
    - ./app_logs/api:/app/app_logs
  logging: *default-logging
  restart: unless-stopped
  networks: [maxapp]
  <<: *hardening

services:
  db:
    image: postgres:17-alpine
    container_name: maxapp_db
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # Небольшой хост (2 CPU / 4 GB): консервативные значения, менять вместе с
    # DB_POOL_SIZE в .env (сумма пулов всех процессов < max_connections).
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "idle_in_transaction_session_timeout=300000"
    shm_size: 512mb
    # Порт наружу не публикуется: psql — через ./maxapp --prod psql.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [maxapp]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: maxapp_redis
    logging: *default-logging
    # AOF: сессии бота и стримы событий переживают рестарт. Пароль обязателен
    # даже во внутренней сети: один скомпрометированный контейнер не должен
    # получать доступ к сессиям всех пользователей.
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "noeviction"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    networks: [maxapp]
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 384M

  api:
    <<: *core-service
    container_name: maxapp_api
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    command:
      - "uvicorn"
      - "core.api.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--workers"
      - "${API_WORKERS:-1}"
      - "--proxy-headers"
      - "--forwarded-allow-ips"
      - "*"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
          pids: 200

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    image: maxapp-bot:latest
    container_name: maxapp_bot
    logging: *default-logging
    env_file: .env
    environment:
      ENV: production
      # Всегда webhook: polling в проде снял бы подписку и не масштабируется.
      BOT_MODE: webhook
      REDIS_HOST: redis
      LOG_FORMAT: json
      LOG_DIR: /app/app_logs
    volumes:
      - ./app_logs/bot:/app/app_logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [maxapp]
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 384M
          pids: 100

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: maxapp-gateway:latest
    container_name: maxapp_gateway
    logging: *default-logging
    environment:
      DOMAIN: ${DOMAIN}
      BOT_WEBHOOK_PATH: ${BOT_WEBHOOK_PATH:-/bot/webhook}
      # envsubst подставляет только эти переменные; всё остальное в шаблоне — nginx.
      NGINX_ENVSUBST_FILTER: ^(DOMAIN|BOT_WEBHOOK_PATH)$$
    # gateway живёт на 80/443 (ACME http-01 и редирект на https); порты меняются в .env.
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ./gateway/ssl:/etc/nginx/ssl:ro
      - ./gateway/acme:/var/www/acme:ro
      # Единственное rw-монтирование: посуточный access-лог (log_format maxapp_evidence).
      - ./app_logs/nginx:/var/log/nginx/evidence
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks: [maxapp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true

  db_backup:
    # Суточный pg_dump (custom-format) в ./backups в DB_BACKUP_HOUR_UTC, хранит
    # DB_BACKUP_KEEP последних. Рядом кладёт .sha256: оборванная передача дампа
    # на другой хост иначе выглядит как нормальный бэкап до момента восстановления.
    # Догон при старте: если контейнер лежал в свой час — снимает сразу.
    image: postgres:17-alpine
    container_name: maxapp_db_backup
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    # Только то, что нужно дампу: секреты api и бота в этот контейнер не попадают.
    environment:
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      PGPASSWORD: ${DB_PASSWORD}
      DB_BACKUP_HOUR_UTC: ${DB_BACKUP_HOUR_UTC:-3}
      DB_BACKUP_KEEP: ${DB_BACKUP_KEEP:-14}
    volumes:
      - ./backups:/backups
    command: >
      sh -c "
        umask 077;
        hour=$$(expr $${DB_BACKUP_HOUR_UTC:-3} + 0);
        keep=$$(expr $${DB_BACKUP_KEEP:-14} + 0);
        dump() {
          ts=$$(date -u +%Y%m%d_%H%M%S);
          out=/backups/$${DB_NAME}_$$ts.dump;
          echo \"[db_backup] dumping to $$out\";
          if pg_dump -h db -U $${DB_USER} -d $${DB_NAME} -Fc -f $$out.tmp; then mv $$out.tmp $$out; (cd /backups && sha256sum $$(basename $$out) > $$(basename $$out).sha256); echo '[db_backup] dump complete'; else echo '[db_backup] dump FAILED'; rm -f $$out.tmp; fi;
          ls -1t /backups/$${DB_NAME}_*.dump 2>/dev/null | tail -n +$$((keep + 1)) | while read f; do rm -f \"$$f\" \"$$f.sha256\"; done;
        };
        if [ $$(($$(date -u +%s) % 86400)) -ge $$((hour * 3600)) ] && ! ls /backups/$${DB_NAME}_$$(date -u +%Y%m%d)_*.dump >/dev/null 2>&1; then echo '[db_backup] catch-up: no dump for today'; dump; fi;
        while true; do
          delay=$$((hour * 3600 - $$(date -u +%s) % 86400));
          [ $$delay -le 0 ] && delay=$$((delay + 86400));
          echo \"[db_backup] next dump in $$delay s\";
          sleep $$delay;
          dump;
        done
      "
    restart: unless-stopped
    networks: [maxapp]
    security_opt:
      - no-new-privileges:true

networks:
  maxapp:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
