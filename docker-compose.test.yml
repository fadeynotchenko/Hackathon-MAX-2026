# Эфемерные Postgres и Redis для интеграционных прогонов на настоящих сервисах
# (по умолчанию тесты идут на SQLite + fakeredis и этого стенда не требуют).
#
#   docker compose -f docker-compose.test.yml up -d
#   TEST_DATABASE_URL=postgresql+asyncpg://maxapp:maxapp@localhost:5544/maxapp_test \
#   TEST_REDIS_URL=redis://localhost:6544/0 uv run alembic -x url=$TEST_DATABASE_URL upgrade head
#   docker compose -f docker-compose.test.yml down -v
#
# Порты 5544/6544 не пересекаются ни с dev-стендом (5490/6490), ни с другими проектами. Данные в tmpfs: после down всё исчезает.
services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: maxapp
      POSTGRES_PASSWORD: maxapp
      POSTGRES_DB: maxapp_test
    ports:
      - "127.0.0.1:5544:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxapp -d maxapp_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  test-redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6544:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
