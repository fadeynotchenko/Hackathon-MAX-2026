# Общие заголовки проксирования в апстримы (api, bot).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Сшивка логов: этот же id уходит в лог nginx (rid=) и в лог приложения
# (request_id). proxy_set_header, а не pass-through: клиентское значение
# затирается, подделать корреляцию нельзя.
proxy_set_header X-Request-ID $request_id;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
