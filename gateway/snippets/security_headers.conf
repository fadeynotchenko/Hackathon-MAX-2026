# Подключается в каждом публичном location (nginx отбрасывает add_header
# родителя, если в дочернем блоке есть свой add_header — поэтому snippet, а не
# server-level). `always` — заголовки уходят и на 4xx/5xx.
#
# CSP собрана под мини-апп MAX:
#   script-src  — сам бандл + мост https://st.max.ru (window.WebApp).
#   connect-src — API на том же origin + st.max.ru (мост ходит за конфигом).
#   frame-ancestors — веб-клиент MAX открывает мини-апп во фрейме со своего
#     домена; без этого приложение пустое в браузерной версии мессенджера.
#     X-Frame-Options не ставим: он конфликтовал бы с frame-ancestors.
#   img-src — аватары пользователей MAX приходят с их CDN, разрешаем https:.
#
# Permissions-Policy: камера и микрофон — только самому мини-аппу: съёмка
# карточки предприятия и голосовое на заполнение документа.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://st.max.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://st.max.ru https://*.max.ru; frame-ancestors 'self' https://max.ru https://*.max.ru https://web.max.ru; base-uri 'self'; form-action 'self'; object-src 'none';" always;
