# Два TS-воркспейса. Python-сервис core/ управляется uv и в workspace не входит.
packages:
  - bot
  - web

# Настройки pnpm (в pnpm 12 они живут здесь, а не в .npmrc).
autoInstallPeers: true
strictPeerDependencies: false

# Скрипты установки разрешены только тем пакетам, которым они реально нужны
# (esbuild качает бинарник под платформу). Остальные postinstall не выполняются:
# pnpm блокирует их по умолчанию, и это правильно.
allowBuilds:
  esbuild: true

# Политика «минимальный возраст релиза» защищает от только что опубликованных
# (потенциально скомпрометированных) версий. Исключения ниже pnpm добавил при
# установке для пакетов моложе порога; список пересматривать при обновлениях.
minimumReleaseAgeExclude:
  - "@types/node@24.13.5"
  - "@vitest/mocker@5.0.1"
  - "@vitest/spy@5.0.1"
  - react-router-dom@7.18.4
  - react-router@7.18.4
  - vitest@5.0.1
